[project]
name = "raglab"
version = "0.1.0"
description = "Local advanced-RAG lab: real models, real indexes, full stage-by-stage traces"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ntama16" }]
keywords = ["rag", "retrieval-augmented-generation", "llm", "hnsw", "bm25", "reranking", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "hnswlib>=0.8",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  # Front matter is parsed with a real YAML reader rather than by hand: the hand-rolled one
  # flattened nested maps into invented top-level keys and stored a folded scalar's `>` as its
  # value, which turns into a self-query filter that matches nothing. Upper-bounded because a 7.0
  # is free to change safe_load's behaviour.
  "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/ntama16/RAG-Lab-Advanced"
Tour = "https://ntama16.github.io/raglab-tour/"
Issues = "https://github.com/ntama16/RAG-Lab-Advanced/issues"

[project.optional-dependencies]
# In-process cross-encoder reranking (pulls in torch, ~2 GB with its transitive dependencies).
# Upper-bounded on purpose: ">=3.0" alone resolved to 6.1.0, three major versions past what this
# was written against. The API raglab uses — CrossEncoder(name) and .predict([(query, doc)]) — held
# across that jump, but by luck rather than by contract, and a 7.0 is free to break it.
crossencoder = ["sentence-transformers>=3.0,<7"]
umap = ["umap-learn>=0.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
raglab = "raglab.main:cli"

[build-system]
requires = ["setuptools>=77"]  # 77 is the first to read the SPDX `license` and `license-files` fields
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["raglab"]

[tool.setuptools.package-data]
raglab = ["static/**/*", "sample_corpus/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
